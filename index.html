  <script>


    /* =====================================
       ELEMENTOS

    const loginScreen =
      document.getElementById("login-screen");

      document.getElementById("trainer-panel");

    const studentsButton =

      document.getElementById("students-screen");

    const studentsList =

    const addStudentButton =
      document.getElementById("add-student-button");


    /* =====================================
       MOSTRAR LOGIN
    ====================================== */

    function showLogin() {

      loginScreen.style.display = "block";

      appScreen.style.display = "none";

      studentsScreen.style.display = "none";

    }


    /* =====================================
       MOSTRAR PANEL
    ====================================== */

    function showApp() {

      loginScreen.style.display = "none";

      appScreen.style.display = "block";

      studentsScreen.style.display = "none";

    }


    /* =====================================
       COMPROBAR SESIÓN
    ====================================== */

    async function checkSession() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();


      if (session) {

        showApp();

      } else {

        showLogin();

      }

    }


    /* =====================================
       LOGIN
    ====================================== */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        loginMessage.textContent =
          "INGRESANDO...";


        const email =
          document.getElementById("email").value.trim();


        const password =
          document.getElementById("password").value;


        const {
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          console.error(error);

          loginMessage.textContent =
            "EMAIL O CONTRASEÑA INCORRECTOS.";

          return;

        }


        loginMessage.textContent = "";

        showApp();

      }
    );


    /* =====================================
       CAMBIO DE SESIÓN
    ====================================== */

    supabaseClient.auth.onAuthStateChange(
      function(event, session) {

        if (session) {

          showApp();

        } else {

          showLogin();

        }

      }
    );


    /* =====================================
       ABRIR MIS ALUMNAS
    ====================================== */

    studentsButton.addEventListener(
      "click",
      async function() {

        appScreen.style.display = "none";

        studentsScreen.style.display = "block";

        await loadStudents();

      }
    );


    /* =====================================
       VOLVER AL PANEL
    ====================================== */

    backToPanel.addEventListener(
      "click",
      function() {

        studentsScreen.style.display = "none";

        appScreen.style.display = "block";

      }
    );


    /* =====================================
       CARGAR ALUMNAS
    ====================================== */

    async function loadStudents() {

      studentsList.innerHTML = `
        <p class="students-loading">
          CARGANDO ALUMNAS...
        </p>
      `;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("id, full_name, role")
          .eq("role", "student")
          .order("full_name", {
            ascending: true
          });


      if (error) {

        console.error(
          "Error cargando alumnas:",
          error
        );


        studentsList.innerHTML = `
          <p class="students-empty">
            NO SE PUDIERON CARGAR LAS ALUMNAS.
          </p>
        `;


        return;

      }


      if (!data || data.length === 0) {

        studentsList.innerHTML = `
          <p class="students-empty">
            TODAVÍA NO HAY ALUMNAS CARGADAS.
          </p>
        `;


        return;

      }


      studentsList.innerHTML = "";


      data.forEach(
        function(student) {


          const card =
            document.createElement("div");


          card.className =
            "student-card";


          card.innerHTML = `

            <div class="student-name">
              ${student.full_name || "SIN NOMBRE"}
            </div>

            <div class="student-email">
              ALUMNA FORJA
            </div>

          `;


          studentsList.appendChild(card);

        }
      );

    }
