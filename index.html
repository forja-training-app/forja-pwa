<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#000000">

  <title>FORJA Training</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      padding: 30px 22px;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 60px;
    }

    .logo span {
      color: #dc2626;
    }

    .welcome {
      margin-bottom: 35px;
    }

    .welcome small {
      color: #dc2626;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .welcome h1 {
      font-size: 38px;
      line-height: 1;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .welcome p {
      color: #999999;
      margin-top: 12px;
      line-height: 1.5;
    }

    .training {
      background: #111111;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 22px;
    }

    .training-title {
      color: #dc2626;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .training h2 {
      font-size: 27px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .training p {
      color: #999999;
      margin-bottom: 22px;
    }

    .details {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .detail {
      flex: 1;
      background: #1b1b1b;
      border-radius: 10px;
      padding: 12px;
    }

    .detail small {
      display: block;
      color: #777777;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .detail strong {
      font-size: 15px;
    }

    .button {
      display: block;
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 16px;
      background: #dc2626;
      color: white;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 14px;
    }

    .quote {
      margin-top: 35px;
      border-left: 3px solid #dc2626;
      padding-left: 15px;
      color: #888888;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">
      FORJA<span>.</span>
    </div>

    <section class="welcome">

      <small>Forjando atletas</small>

      <h1>
        Bienvenida<br>
        a FORJA
      </h1>

      <p>
        Tu entrenamiento. Tu progreso. Tu proceso.
      </p>

    </section>

    <section class="training">

      <div class="training-title">
        ENTRENAMIENTO DE HOY
      </div>

      <h2>
        Tren inferior
      </h2>

      <p>
        Semana 1 · Día 1
      </p>

      <div class="details">

        <div class="detail">
          <small>EJERCICIOS</small>
          <strong>6</strong>
        </div>

        <div class="detail">
          <small>DURACIÓN</small>
          <strong>60 min</strong>
        </div>

        <div class="detail">
          <small>RPE</small>
          <strong>8</strong>
        </div>

      </div>

      <button class="button">
        Comenzar entrenamiento
      </button>

    </section>

    <div class="quote">
      Entrená con propósito.<br>
      Forjá tu mejor versión.
    </div>

  </main>

</body>
</html>
