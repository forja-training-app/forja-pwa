<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FORJA Training</title>
  
  <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E60000">

  <!-- Tipografías FORJA -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
    }

    .app {
      display: none;
      position: relative;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 28px 22px 40px;
      overflow: hidden;
    }

    /* Gráficos rojos de fondo */

    .graphic {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .graphic-one {
      width: 180px;
      height: 180px;
      border: 2px solid #E60000;
      transform: rotate(45deg);
      top: -100px;
      right: -90px;
      opacity: 0.35;
    }

    .graphic-two {
      width: 120px;
      height: 8px;
      background: #E60000;
      transform: rotate(-35deg);
      bottom: 80px;
      left: -55px;
      opacity: 0.5;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    /* Logo */

    .logo {
  margin-bottom: 65px;
}

.logo img {
  width: 150px;
  height: auto;
  display: block;
}

    /* Texto pequeño */

    .eyebrow {
      color: #E60000;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* Títulos */

    h1,
    h2 {
      font-family: 'Anton', sans-serif;
      text-transform: uppercase;
      font-weight: 400;
      letter-spacing: 1px;
    }

    h1 {
      color: #E60000;
      font-size: 48px;
      line-height: 0.95;
    }

    h2 {
      color: #E60000;
      font-size: 34px;
      line-height: 1;
    }

    .welcome {
      margin-bottom: 42px;
    }

    .welcome p {
      color: #ffffff;
      opacity: 0.7;
      font-size: 14px;
      line-height: 1.6;
      margin-top: 14px;
    }

    /* Tarjeta entrenamiento */

    .training {
      position: relative;
      background: #0b0b0b;
      border: 1px solid #262626;
      padding: 24px 20px;
    }

    .training::before {
      content: "";
      position: absolute;
      width: 5px;
      height: 55px;
      background: #E60000;
      left: 0;
      top: 24px;
    }

    .training-info {
      color: #ffffff;
      opacity: 0.55;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
      margin-bottom: 24px;
    }

    /* Datos */

    .details {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .detail {
      flex: 1;
      border: 1px solid #242424;
      padding: 12px 8px;
      background: #111111;
    }

    .detail small {
      display: block;
      color: #777777;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .detail strong {
      color: #ffffff;
      font-size: 14px;
    }

    /* Botón */

    .button {
      width: 100%;
      border: none;
      padding: 17px;
      background: #E60000;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* Frase */

    .quote {
      margin-top: 38px;
      padding-left: 14px;
      border-left: 3px solid #E60000;
      color: #ffffff;
      opacity: 0.55;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (min-width: 700px) {
      .app {
        padding-top: 45px;
      }
    }
        /* LOGIN */

    .login-screen {
      display: none;
      position: relative;
      z-index: 2;
      min-height: 100vh;
      padding: 60px 22px 40px;
      max-width: 520px;
      margin: auto;
    }

    .login-logo {
      margin-bottom: 55px;
    }

    .login-logo img {
      width: 150px;
      height: auto;
      display: block;
    }

    .login-screen h1 {
      margin-bottom: 35px;
    }

    #login-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #login-form label {
      color: #777777;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-top: 8px;
    }

    #login-form input {
      width: 100%;
      padding: 15px;
      background: #111111;
      border: 1px solid #292929;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      outline: none;
    }

    #login-form input:focus {
      border-color: #E60000;
    }

    #login-message {
      color: #E60000;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
    }
  </style>
    <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://mjrdhybwaovnrzlzfxcw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_KnKdmC7svdn8w_SB6-R2fg_E8pTbxUN";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  </script>
</head>
  
<body>
  <!-- LOGIN -->
  <section id="login-screen" class="login-screen">

    <div class="login-logo">
      <img src="./logo-forja.png" alt="FORJA Training">
    </div>

    <div class="eyebrow">
      FORJANDO ATLETAS
    </div>

    <h1>INICIAR<br>SESIÓN</h1>

    <form id="login-form">

      <label for="email">EMAIL</label>
      <input
        type="email"
        id="email"
        placeholder="Tu email"
        required
      >

      <label for="password">CONTRASEÑA</label>
      <input
        type="password"
        id="password"
        placeholder="Tu contraseña"
        required
      >

      <button type="submit" class="button">
        INGRESAR →
      </button>

      <p id="login-message"></p>

    </form>

  </section>
  <main class="app">

    <div class="graphic graphic-one"></div>
    <div class="graphic graphic-two"></div>

    <div class="content">

      <div class="logo">
  <img src="./logo-forja.png" alt="FORJA Training">
      </div>

      <section class="welcome">

        <div class="eyebrow">
          FORJANDO ATLETAS
        </div>

        <h1>
          BIENVENIDA<br>
          A FORJA
        </h1>

        <p>
          Tu entrenamiento. Tu progreso. Tu proceso.
        </p>

      </section>

      <section class="training">

        <div class="eyebrow">
          ENTRENAMIENTO DE HOY
        </div>

        <h2>
          TREN INFERIOR
        </h2>

        <div class="training-info">
          SEMANA 1 · DÍA 1
        </div>

        <div class="details">

          <div class="detail">
            <small>EJERCICIOS</small>
            <strong>6</strong>
          </div>

          <div class="detail">
            <small>DURACIÓN</small>
            <strong>60 MIN</strong>
          </div>

          <div class="detail">
            <small>RPE</small>
            <strong>8</strong>
          </div>

        </div>

        <button class="button">
          COMENZAR ENTRENAMIENTO →
        </button>

      </section>

      <div class="quote">
        Entrená con propósito.<br>
        Forjá tu mejor versión.
      </div>

    </div>

  </main>

    <script>

  const loginScreen = document.getElementById("login-screen");
  const appScreen = document.querySelector(".app");
  const loginForm = document.getElementById("login-form");
  const loginMessage = document.getElementById("login-message");


  async function checkSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
      loginScreen.style.display = "none";
      appScreen.style.display = "block";
    } else {
      loginScreen.style.display = "block";
      appScreen.style.display = "none";
    }

  }


  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    loginMessage.textContent = "INGRESANDO...";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;


    const { error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


    if (error) {

      loginMessage.textContent =
        "EMAIL O CONTRASEÑA INCORRECTOS.";

      return;

    }


    loginMessage.textContent = "";

    await checkSession();

  });


  supabaseClient.auth.onAuthStateChange(() => {
    checkSession();
  });


  checkSession();


  if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });

  }

</script>

</body>
</html>
