<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FORJA Training</title>
  
  <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E60000">

  <!-- Tipografías FORJA -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
    }

    .app {
      position: relative;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 28px 22px 40px;
      overflow: hidden;
    }

    /* Gráficos rojos de fondo */

    .graphic {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .graphic-one {
      width: 180px;
      height: 180px;
      border: 2px solid #E60000;
      transform: rotate(45deg);
      top: -100px;
      right: -90px;
      opacity: 0.35;
    }

    .graphic-two {
      width: 120px;
      height: 8px;
      background: #E60000;
      transform: rotate(-35deg);
      bottom: 80px;
      left: -55px;
      opacity: 0.5;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    /* Logo */

    .logo {
      font-family: 'Anton', sans-serif;
      font-size: 38px;
      letter-spacing: 2px;
      color: #E60000;
      margin-bottom: 65px;
    }

    .logo span {
      color: #ffffff;
    }

    /* Texto pequeño */

    .eyebrow {
      color: #E60000;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* Títulos */

    h1,
    h2 {
      font-family: 'Anton', sans-serif;
      text-transform: uppercase;
      font-weight: 400;
      letter-spacing: 1px;
    }

    h1 {
      color: #E60000;
      font-size: 48px;
      line-height: 0.95;
    }

    h2 {
      color: #E60000;
      font-size: 34px;
      line-height: 1;
    }

    .welcome {
      margin-bottom: 42px;
    }

    .welcome p {
      color: #ffffff;
      opacity: 0.7;
      font-size: 14px;
      line-height: 1.6;
      margin-top: 14px;
    }

    /* Tarjeta entrenamiento */

    .training {
      position: relative;
      background: #0b0b0b;
      border: 1px solid #262626;
      padding: 24px 20px;
    }

    .training::before {
      content: "";
      position: absolute;
      width: 5px;
      height: 55px;
      background: #E60000;
      left: 0;
      top: 24px;
    }

    .training-info {
      color: #ffffff;
      opacity: 0.55;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
      margin-bottom: 24px;
    }

    /* Datos */

    .details {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .detail {
      flex: 1;
      border: 1px solid #242424;
      padding: 12px 8px;
      background: #111111;
    }

    .detail small {
      display: block;
      color: #777777;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .detail strong {
      color: #ffffff;
      font-size: 14px;
    }

    /* Botón */

    .button {
      width: 100%;
      border: none;
      padding: 17px;
      background: #E60000;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* Frase */

    .quote {
      margin-top: 38px;
      padding-left: 14px;
      border-left: 3px solid #E60000;
      color: #ffffff;
      opacity: 0.55;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (min-width: 700px) {
      .app {
        padding-top: 45px;
      }
    }
  </style>
</head>
  
<body>

  <main class="app">

    <div class="graphic graphic-one"></div>
    <div class="graphic graphic-two"></div>

    <div class="content">

      <div class="logo">
        FORJA<span>.</span>
      </div>

      <section class="welcome">

        <div class="eyebrow">
          FORJANDO ATLETAS
        </div>

        <h1>
          BIENVENIDA<br>
          A FORJA
        </h1>

        <p>
          Tu entrenamiento. Tu progreso. Tu proceso.
        </p>

      </section>

      <section class="training">

        <div class="eyebrow">
          ENTRENAMIENTO DE HOY
        </div>

        <h2>
          TREN INFERIOR
        </h2>

        <div class="training-info">
          SEMANA 1 · DÍA 1
        </div>

        <div class="details">

          <div class="detail">
            <small>EJERCICIOS</small>
            <strong>6</strong>
          </div>

          <div class="detail">
            <small>DURACIÓN</small>
            <strong>60 MIN</strong>
          </div>

          <div class="detail">
            <small>RPE</small>
            <strong>8</strong>
          </div>

        </div>

        <button class="button">
          COMENZAR ENTRENAMIENTO →
        </button>

      </section>

      <div class="quote">
        Entrená con propósito.<br>
        Forjá tu mejor versión.
      </div>

    </div>

  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

</body>
</html>
